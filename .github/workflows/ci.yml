name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-gitleaks
      - name: Scan source and history for secrets
        run: gitleaks git --no-banner --redact .
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm package
      - name: Scan release payloads for secrets
        run: gitleaks dir --max-archive-depth 2 --no-banner --redact release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - name: Check packaged JavaScript with Node 20
        run: |
          node --check dist/com.beastyrabbit.t3-code-status.sdPlugin/bin/plugin.cjs
          node --check dist/setup-opendeck.mjs
          node --input-type=module -e 'await import("./dist/setup-opendeck.mjs")'
