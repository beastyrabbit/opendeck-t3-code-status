name: Setup Gitleaks
description: Install the pinned Gitleaks binary after verifying its published checksum

runs:
  using: composite
  steps:
    - name: Download Gitleaks
      shell: bash
      env:
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        GITLEAKS_VERSION: 8.30.1
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl --fail --location --silent --show-error \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
        tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
        printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
